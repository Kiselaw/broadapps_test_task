services:
  api:
    build: .
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health', headers={'X-Internal-Healthcheck': os.environ['APP_INTERNAL_HEALTHCHECK_SECRET']}); urllib.request.urlopen(request, timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./logs:/service/logs

  generation_worker:
    build: .
    command: >
      uv run celery -A app.infrastructure.tasks.celery_app:celery_app worker
      -n generation-worker@%h
      --queues ${APP_CELERY_GENERATION_QUEUE:-generation}
      --loglevel INFO
      --concurrency ${APP_CELERY_GENERATION_CONCURRENCY:-2}
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs:/service/logs

  webhook_worker:
    build: .
    command: >
      uv run celery -A app.infrastructure.tasks.celery_app:celery_app worker
      -n webhook-worker@%h
      --queues ${APP_CELERY_WEBHOOKS_QUEUE:-webhooks}
      --loglevel INFO
      --concurrency ${APP_CELERY_WEBHOOK_CONCURRENCY:-4}
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs:/service/logs

  flower:
    build: .
    command: >
      uv run celery -A app.infrastructure.tasks.celery_app:celery_app flower
      --port=${APP_CELERY_FLOWER_PORT:-5555}
    env_file:
      - .env
    ports:
      - "${APP_CELERY_FLOWER_PORT:-5555}:${APP_CELERY_FLOWER_PORT:-5555}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: broadapps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d broadapps"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  rabbitmq_data:
