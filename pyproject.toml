[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broadapps-content-service"
version = "0.1.0"
description = "Async content generation microservice with balance management and webhook delivery."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.16.0",
    "asyncpg>=0.29.0",
    "celery>=5.4.0",
    "fal-client>=0.7.0",
    "fastapi>=0.115.0",
    "flower>=2.0.1",
    "httpx>=0.27.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.36",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
